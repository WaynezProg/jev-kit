<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decision Loop Fixture</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #18212b; }
      main { border: 1px solid #d9e1ea; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px #18212b12; }
      #goal { background: #f4f8fc; border-radius: 8px; padding: 1rem; }
      #options { display: grid; gap: .7rem; margin: 1.25rem 0; }
      button { text-align: left; padding: .8rem 1rem; font: inherit; border: 1px solid #9aaabd; border-radius: 8px; background: white; cursor: pointer; }
      button:hover { background: #eef6ff; border-color: #336fa6; }
      #message { min-height: 1.5rem; font-weight: 600; }
      .error { color: #a02222; } .done { color: #146c43; }
      #selected { padding-left: 1.2rem; }
    </style>
  </head>
  <body data-state="active">
    <main>
      <h1>Research workspace</h1>
      <p id="goal" data-goal></p>
      <h2 id="prompt" data-prompt></h2>
      <div id="options" aria-label="Available choices"></div>
      <p id="message" role="status"></p>
      <button id="back" hidden type="button">Back</button>
      <section id="complete" hidden>
        <h2>Results ready</h2>
        <p>Selected path:</p>
        <ol id="selection"></ol>
      </section>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const requestedId = params.get('task');
        const body = document.body;
        const goal = document.querySelector('#goal');
        const prompt = document.querySelector('#prompt');
        const options = document.querySelector('#options');
        const message = document.querySelector('#message');
        const back = document.querySelector('#back');
        const complete = document.querySelector('#complete');
        const selected = document.querySelector('#selection');
        let task;
        let stageIndex = 0;
        let selections = [];

        function renderStage() {
          const stage = task.stages[stageIndex];
          body.dataset.state = 'active';
          prompt.textContent = stage.prompt;
          options.replaceChildren();
          message.textContent = '';
          message.className = '';
          back.hidden = true;
          stage.options.forEach((option) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.option = option.id;
            button.textContent = option.label;
            button.addEventListener('click', () => choose(option.id));
            options.append(button);
          });
        }

        function choose(optionId) {
          const stage = task.stages[stageIndex];
          if (optionId !== stage.correct_id) {
            body.dataset.state = 'error';
            message.textContent = 'That route does not match the current goal. Go back and try another choice.';
            message.className = 'error';
            options.replaceChildren();
            back.hidden = false;
            return;
          }
          const option = stage.options.find((entry) => entry.id === optionId);
          selections.push({ id: option.id, label: option.label });
          stageIndex += 1;
          if (stageIndex === task.stages.length) {
            renderDone();
          } else {
            renderStage();
          }
        }

        function renderDone() {
          body.dataset.state = 'done';
          prompt.textContent = 'Your requested path is complete.';
          options.replaceChildren();
          message.textContent = '';
          complete.hidden = false;
          selected.replaceChildren(...selections.map((entry) => {
            const item = document.createElement('li');
            item.textContent = entry.label;
            return item;
          }));
        }

        back.addEventListener('click', renderStage);
        fetch('./tasks.json')
          .then((response) => response.ok ? response.json() : Promise.reject(new Error('Could not load tasks.')))
          .then((tasks) => {
            task = tasks.find((entry) => entry.id === requestedId) || tasks[0];
            body.dataset.task = task.id;
            goal.textContent = task.goal;
            window.fixtureState = {
              get taskId() { return task.id; },
              get stage() { return stageIndex; },
              get selected() { return selections.map((entry) => entry.id); }
            };
            renderStage();
          })
          .catch((error) => {
            body.dataset.state = 'error';
            goal.textContent = 'Fixture failed to load.';
            prompt.textContent = error.message;
          });
      })();
    </script>
  </body>
</html>
